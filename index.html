<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, user-scalable=yes">
    <title>사전공개문제 - 연도 선택</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .year-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .exam-btn {
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
        }

        .btn-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .year-title {
            font-size: 28px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .year-grid {
                gap: 15px;
                padding: 15px;
            }

            .exam-btn {
                min-height: 120px;
            }

            .year-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="quiz-container" id="quiz">
        <div class="quiz-header">
            <div class="header-left">
                <h1>사전공개문제</h1>
                <p class="subtitle">연도를 선택하세요</p>
            </div>
        </div>
        <div class="container">
            <div class="year-grid">
                <button onclick="location.href='2025-subjects.html'" class="exam-btn">
                    <div class="btn-inner">
                        <div class="year-title">2025년</div>
                    </div>
                </button>
                <button onclick="location.href='2026.html'" class="exam-btn">
                    <div class="btn-inner">
                        <div class="year-title">2026년</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <div class="powered-by-badge">
        powered by 2170153
    </div>

    <script src="script.js"></script>
</body>
</html>
